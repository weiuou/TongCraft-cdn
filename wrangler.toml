name = "tongcraft-cdn"
main = "src/index.js"
compatibility_date = "2024-04-27"

# R2 bucket binding
[[r2_buckets]]
binding = "AVATARS_BUCKET"
bucket_name = "tongcraft-avatars"

# KV namespace for metadata (optional, for caching)
# [[kv_namespaces]]
# binding = "AVATARS_KV"
# id = "your-kv-namespace-id"

[vars]
API_BASE = "https://api.tongcraft-cdn.example.com"
CDN_BASE = "https://tongcraft-cdn.example.com"

# Static assets (avatars)
[site]
bucket = "./avatars"
entry-point = "workers-site"
