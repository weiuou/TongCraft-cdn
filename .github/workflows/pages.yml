name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      players:
        description: '要添加的玩家名，多个玩家可用空格、逗号或换行分隔；留空则只刷新已有玩家皮肤'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore avatar and skin cache
        uses: actions/cache@v4
        with:
          path: |
            avatars
            skins
          key: ${{ runner.os }}-mojang-assets-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-mojang-assets-

      - name: Add players from manual input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.players != '' }}
        env:
          PLAYERS_INPUT: ${{ inputs.players }}
        run: npm run add-player -- "$PLAYERS_INPUT"

      - name: Fetch player avatars and skins
        run: npm run fetch

      - name: Commit updated player data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.players != '' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: add players from workflow'
          file_pattern: data/players.json data/avatars-meta.json

      - name: Build static site
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
